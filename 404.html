<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Lucie Goguel, Product Designer</title>
  <meta name="description" content="Page introuvable.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/portfolio/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Geist+Mono:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/portfolio/assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="topbar">
    <div class="inner">
      <a class="topbar__home" href="/portfolio/">Lucie Goguel<span class="sr-only"> — retour à l’accueil</span></a>
      <nav class="nav" aria-label="Navigation principale">
        <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="menu-principal">
          <span class="sr-only">Menu</span>
          <svg class="nav__icon-open" aria-hidden="true" width="22" height="16" viewBox="0 0 22 16" fill="currentColor"><path d="M0 0h22v2.4H0zm0 6.8h22v2.4H0zm0 6.8h22V16H0z"/></svg>
          <svg class="nav__icon-close" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M1.5 1.5l15 15M16.5 1.5l-15 15"/></svg>
        </button>
        <ul id="menu-principal">
          <li><a href="/portfolio/">Accueil</a></li>
          <li><a href="/portfolio/#projets">Projets</a></li>
          <li><a href="/portfolio/#a-propos">À propos</a></li>
          <li><a href="/portfolio/#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenu" class="soon">
    <p class="soon__eyebrow">Erreur 404</p>
    <div class="section-head">
      <h1 class="section-title">Cette page n’existe pas</h1>
    </div>
    <div class="soon__grid">
      <div class="soon__panel">
        <p>Le lien est peut-être erroné, ou la page a été déplacée.</p>
        <a class="btn btn--dark" href="/portfolio/"><svg aria-hidden="true" width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><path d="M6.4 0l1 1-4.3 4.3H15v1.4H3.1L7.4 11l-1 1L0 6z"/></svg>Retour à l’accueil</a>
      </div>
    </div>
  </main>
  <footer class="footer">
    <p>© 2026 Lucie Goguel - Product Designer, Paris</p>
    <a href="/portfolio/">Retour à l’accueil <svg aria-hidden="true" width="12" height="15" viewBox="0 0 12 15" fill="currentColor"><path d="M0 6.4 1 7.4l4.3-4.3V15h1.4V3.1L11 7.4l1-1L6 .4z"/></svg></a>
  </footer>
  <script>
    // Menu hamburger (mobile)
    (function () {
      var nav = document.querySelector('.nav'), t = nav && nav.querySelector('.nav__toggle');
      if (!t) return;
      function set(open) {
        nav.classList.toggle('is-open', open);
        document.body.classList.toggle('menu-open', open);
        t.setAttribute('aria-expanded', open);
        t.querySelector('.sr-only').textContent = open ? 'Fermer le menu' : 'Menu';
      }
      t.addEventListener('click', function () { set(!nav.classList.contains('is-open')); });
      nav.querySelectorAll('ul a').forEach(function (a) { a.addEventListener('click', function () { set(false); }); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && nav.classList.contains('is-open')) { set(false); t.focus(); } });
      window.addEventListener('resize', function () { if (window.innerWidth > 750) set(false); });
    })();
  </script>
</body>
</html>
